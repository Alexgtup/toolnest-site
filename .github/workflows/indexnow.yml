name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - "robots.txt"
      - "9577e669864c32ece6c3603f0d674ad360dd3b89.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolnest-indexnow
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://toolnest-btq.pages.dev"
          KEY="9577e669864c32ece6c3603f0d674ad360dd3b89"
          for attempt in $(seq 1 36); do
            if curl -fsS "$BASE/$KEY.txt" | grep -qx "$KEY" &&
               curl -fsS "$BASE/renocalc/" >/dev/null &&
               curl -fsS "$BASE/roadbudget/" >/dev/null &&
               curl -fsS "$BASE/invoicelab/" >/dev/null; then
              echo "Cloudflare Pages routes are live."
              exit 0
            fi
            echo "Waiting for Cloudflare Pages... $attempt/36"
            sleep 10
          done
          echo "::error::Cloudflare Pages did not expose the new routes in time."
          exit 1

      - name: Submit changed product URLs to IndexNow and Yandex
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/indexnow.json <<'JSON'
          {
            "host": "toolnest-btq.pages.dev",
            "key": "9577e669864c32ece6c3603f0d674ad360dd3b89",
            "keyLocation": "https://toolnest-btq.pages.dev/9577e669864c32ece6c3603f0d674ad360dd3b89.txt",
            "urlList": [
              "https://toolnest-btq.pages.dev/",
              "https://toolnest-btq.pages.dev/renocalc/",
              "https://toolnest-btq.pages.dev/roadbudget/",
              "https://toolnest-btq.pages.dev/invoicelab/"
            ]
          }
          JSON

          for endpoint in "https://api.indexnow.org/indexnow" "https://yandex.com/indexnow"; do
            code=$(curl -sS -o /tmp/response.txt -w '%{http_code}'               -H 'Content-Type: application/json; charset=utf-8'               --data-binary @/tmp/indexnow.json "$endpoint" || true)
            echo "$endpoint -> HTTP $code"
            cat /tmp/response.txt || true
            echo
            case "$code" in
              200|202) ;;
              *) exit 1 ;;
            esac
          done
