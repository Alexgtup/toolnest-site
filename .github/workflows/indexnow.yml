name: Notify IndexNow

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolnest-indexnow
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for standalone Cloudflare sites
        shell: bash
        run: |
          set -euo pipefail
          KEY="9577e669864c32ece6c3603f0d674ad360dd3b89"
          hosts=(
            "toolnest-btq.pages.dev"
            "renocalc-3p1.pages.dev"
            "roadbudget.pages.dev"
            "invoicelab-pch.pages.dev"
          )
          for host in "${hosts[@]}"; do
            ok=0
            for attempt in $(seq 1 36); do
              if curl --max-time 10 -fsS "https://$host/" >/dev/null &&
                 curl --max-time 10 -fsS "https://$host/$KEY.txt" | grep -qx "$KEY"; then
                echo "$host is live and its IndexNow key is reachable."
                ok=1
                break
              fi
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::$host did not become ready in time."
              exit 1
            fi
          done

      - name: Submit canonical roots to IndexNow and Yandex
        shell: bash
        run: |
          set -euo pipefail
          KEY="9577e669864c32ece6c3603f0d674ad360dd3b89"
          hosts=(
            "toolnest-btq.pages.dev"
            "renocalc-3p1.pages.dev"
            "roadbudget.pages.dev"
            "invoicelab-pch.pages.dev"
          )

          submit_host() {
            host="$1"
            cat > /tmp/indexnow.json <<JSON
          {
            "host": "$host",
            "key": "$KEY",
            "keyLocation": "https://$host/$KEY.txt",
            "urlList": ["https://$host/"]
          }
          JSON
            for endpoint in "https://api.indexnow.org/indexnow" "https://yandex.com/indexnow"; do
              code=$(curl --max-time 20 -sS -o /tmp/response.txt -w '%{http_code}' \
                -H 'Content-Type: application/json; charset=utf-8' \
                --data-binary @/tmp/indexnow.json "$endpoint" || true)
              echo "$host -> $endpoint -> HTTP $code"
              case "$code" in
                200|202) ;;
                *) cat /tmp/response.txt || true; exit 1 ;;
              esac
            done
          }

          for host in "${hosts[@]}"; do
            submit_host "$host"
          done
